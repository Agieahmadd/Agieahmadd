<svg width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="200" fill="#0D1117"/>
  <g>
    <circle cx="50" cy="50" r="1.5" fill="#00FFFF">
      <animate attributeName="cy" values="50;200;50" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="50;150;250;350;50" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="100" r="2" fill="#00E5FF">
      <animate attributeName="cy" values="100;180;100" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="150;300;450;150" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="70" r="1.8" fill="#00FFFF">
      <animate attributeName="cy" values="70;190;70" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="300;400;500;300" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
